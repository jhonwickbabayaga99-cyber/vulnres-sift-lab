name: vulnres-freerdp-asan

# Tujuan: menjalankan tahap `poc` (validasi dinamis) TANPA memakai disk/RAM mesin lokal.
# Runner publik = 4 vCPU / 16 GB RAM (gratis & tak terbatas untuk repo publik).
#
# Job 1 static-core : pipeline deterministik sift (graph→recon→slice→analyze→triage)
# Job 2 dynamic-asan: build FreeRDP minimal + harness dgn AddressSanitizer, jalankan, unggah log
#
# Pemicu manual: tab Actions → workflow ini → "Run workflow"

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  FREERDP_REPO: https://github.com/FreeRDP/FreeRDP.git
  # commit yang dianalisis artikel Quarkslab (bisa diganti)
  FREERDP_COMMIT: 993499447e32344370a16936c8434317952df4e3

jobs:
  static-core:
    name: static core (sift)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pasang dependensi inti
        run: |
          python -m pip install --upgrade pip
          python -m pip install networkx tree-sitter tree-sitter-c tree-sitter-cpp

      - name: Ambil FreeRDP (sub-pohon yang dianalisis, revisi dipin)
        run: |
          git clone --filter=blob:none --sparse "$FREERDP_REPO" corpus/freerdp
          cd corpus/freerdp
          git fetch --depth 1 origin "$FREERDP_COMMIT"
          git checkout -q FETCH_HEAD
          git sparse-checkout set libfreerdp/core channels/urbdrc
          echo "revisi: $(git rev-parse HEAD)"

      - name: Index → recon → slice → analyze → triage
        run: |
          set -x
          python3 src/sift.py index  --src corpus/freerdp --db state/freerdp.db
          python3 src/sift.py recon  --db state/freerdp.db --out state/slices.json
          python3 src/sift.py slice  --db state/freerdp.db --dir libfreerdp/core/nego --out state/slice-nego.json
          python3 src/sift.py slice  --db state/freerdp.db --dir libfreerdp/core      --out state/slice-core.json
          python3 src/sift.py analyze --db state/freerdp.db --slice state/slice-nego.json --out state/findings-nego.json
          python3 src/sift.py triage  --in state/findings-nego.json --out state/clusters-nego.json
          python3 src/sift.py analyze --db state/freerdp.db --slice state/slice-core.json --out state/findings-core.json
          python3 src/sift.py triage  --in state/findings-core.json --out state/clusters-core.json

      - name: Ringkas ke job summary
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          print("### Klaster yang relevan (nego)\n")
          d = json.loads(pathlib.Path("state/clusters-nego.json").read_text())
          for c in d["clusters"]:
              if "RoutingToken" in c["key"]:
                  print("- **[%s]** `%s` — %s" % (c["class"], c["key"], c["reason"]))
          print("\n### Ringkasan kelas (core)\n")
          d2 = json.loads(pathlib.Path("state/clusters-core.json").read_text())
          from collections import Counter
          print("```")
          print(dict(Counter(x["class"] for x in d2["clusters"])))
          print("total klaster: %d" % len(d2["clusters"]))
          print("```")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sift-static-results
          path: |
            state/*.json
            state/*.db
          retention-days: 14

  dynamic-asan:
    name: dynamic asan (build + harness)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Pasang toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld cmake ninja-build pkg-config libssl-dev zlib1g-dev \
            libavcodec-dev libavutil-dev libswscale-dev libjpeg-dev libfuse3-dev
          clang --version | head -1
          cmake --version | head -1

      - name: Ambil FreeRDP (penuh, dangkal)
        run: |
          git clone --filter=blob:none "$FREERDP_REPO" freerdp-src
          cd freerdp-src
          git fetch --depth 1 origin "$FREERDP_COMMIT"
          git checkout -q FETCH_HEAD
          echo "revisi rentan: $(git rev-parse HEAD)"

      - name: Konfigurasi FreeRDP (minimal + ASan)
        run: |
          cmake -S freerdp-src -B build-freerdp -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX="$HOME/frdp" \
            -DCMAKE_C_COMPILER=clang \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_FLAGS="-fsanitize=address -fno-omit-frame-pointer -g -O1" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address" \
            -DWITH_SERVER=OFF -DWITH_CLIENT=OFF -DWITH_CHANNELS=OFF \
            -DWITH_X11=OFF -DWITH_WAYLAND=OFF -DWITH_CUPS=OFF \
            -DWITH_PCSC=OFF -DWITH_PULSE=OFF -DWITH_ALSA=OFF \
            -DWITH_FFMPEG=OFF -DWITH_VIDEO_FFMPEG=OFF -DWITH_DSP_FFMPEG=OFF \
            -DWITH_SWSCALE=OFF -DWITH_JPEG=OFF -DWITH_CAIRO=OFF -DWITH_OPUS=OFF \
            -DWITH_OPENCL=OFF -DWITH_OPENH264_LOADING=OFF \
            -DWITH_GSSAPI=OFF -DWITH_KRB5=OFF -DWITH_MANPAGES=OFF \
            -DWITH_VERBOSE_WINPR_ASSERT=OFF -DWITH_SAMPLE=OFF

      - name: Build + install FreeRDP (dengan ASan)
        run: |
          cmake --build build-freerdp --target install -j"$(nproc)"

      - name: Build harness
        run: |
          mkdir -p build-harness
          export PKG_CONFIG_PATH="$HOME/frdp/lib/pkgconfig:$HOME/frdp/lib64/pkgconfig:${PKG_CONFIG_PATH}"
          echo "--- isi prefix install ---"; ls "$HOME/frdp/lib" | head -20
          echo "--- pkg-config freerdp3 ---"; pkg-config --cflags --libs freerdp3 || true
          echo "--- pkg-config --static ---"; pkg-config --static --libs freerdp3 winpr3 || true
          # header publik+generated dari prefix install (pkg-config cflags), header internal dari sumber
          CFLAGS=$(pkg-config --cflags freerdp3 winpr3 2>/dev/null || echo "")
          LIBS=$(pkg-config --static --libs freerdp3 winpr3 2>/dev/null \
                 || pkg-config --libs freerdp3 winpr3 2>/dev/null \
                 || echo "-lfreerdp3 -lwinpr3")
          echo "CFLAGS: $CFLAGS"
          # Bukan tebakan tunggal: coba beberapa set include, berhenti di yang pertama bisa dikompilasi.
          # Satu run tetap konvergen walau satu kombinasi meleset.
          try_build() {
            local label="$1"; shift
            echo "::: kandidat $label"
            if clang -fsanitize=address -fno-omit-frame-pointer -g -O1 \
                 $CFLAGS "$@" \
                 ci/harness/harness_nego.c -o build-harness/harness_nego \
                 -L"$HOME/frdp/lib" $LIBS -lssl -lcrypto -lz -lpthread -lm -ldl \
                 2>"build-harness/try-$label.log"; then
              echo "  BERHASIL: $label"
              return 0
            fi
            echo "  gagal: $label"
            sed -n '1,6p' "build-harness/try-$label.log" | sed 's/^/    /'
            return 1
          }
          INC_SRC="-I$PWD/freerdp-src/libfreerdp/core -I$PWD/freerdp-src/libfreerdp -I$PWD/freerdp-src/winpr/include -I$PWD/freerdp-src/include"
          INC_GEN="-I$PWD/build-freerdp/winpr/include -I$PWD/build-freerdp/include -I$PWD/build-freerdp"
          W=0
          if [ $W = 0 ]; then try_build "A-pkgconfig-sumber" $INC_SRC && W=1; fi
          if [ $W = 0 ]; then try_build "B-buildtree" $INC_GEN $INC_SRC && W=1; fi
          if [ $W = 0 ]; then try_build "C-prefix" -I"$HOME/frdp/include" $INC_SRC && W=1; fi
          if [ $W = 0 ]; then
            INC_CC=$(python3 ci/harness/extract_flags.py build-freerdp/compile_commands.json 2>/dev/null || true)
            echo "::: flag -I dari build FreeRDP sendiri: ${INC_CC:0:160}"
            if [ -n "$INC_CC" ]; then try_build "D-flagresmi" $INC_CC $INC_SRC && W=1; fi
          fi
          if [ $W = 0 ]; then
            echo "::error::semua kandidat include gagal dikompilasi"
            for f in build-harness/try-*.log; do echo "--- $f"; head -12 "$f"; done
            exit 1
          fi
          ls -l build-harness/harness_nego

      - name: Jalankan harness di bawah ASan
        continue-on-error: true
        run: |
          mkdir -p out
          set +e
          ASAN_OPTIONS=detect_leaks=0:abort_on_error=0:fill_byte=0xcd:print_stats=1 \
            ./build-harness/harness_nego > out/asan-run.log 2>&1
          echo "exit=$?" >> out/asan-run.log
          set -e
          echo "--- 40 baris pertama ---"; head -40 out/asan-run.log || true
          grep -nE "AddressSanitizer|ERROR|heap-buffer-overflow|WRITE of size|SUMMARY" out/asan-run.log || echo "tidak ada jejak ASan"

      - name: Tulis verdict ke job summary
        if: always()
        run: |
          {
            echo "### Hasil dinamis (ASan)"
            if grep -q "AddressSanitizer" out/asan-run.log 2>/dev/null; then
              echo '```'
              grep -nE "AddressSanitizer|WRITE of size|READ of size|SUMMARY" out/asan-run.log | head -12
              echo '```'
            else
              echo "Tidak ada jejak ASan pada run ini (lihat artefak log; jalur sink mungkin butuh setup transport)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asan-run-artifacts
          path: |
            out/
            build-harness/harness_nego
            build-freerdp/CMakeCache.txt
          retention-days: 14
